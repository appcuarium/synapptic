name: Tests

on:
  push:
    branches: [master, develop, "release/**"]
  pull_request:
    branches: [master, develop]
  workflow_call:   # the release workflow runs these same tests before it publishes

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # the dashboard extra (fastapi, uvicorn) for the dashboard tests; httpx for FastAPI's TestClient
          pip install -e ".[dashboard]"
          pip install pytest httpx

      - name: Run tests
        run: python -m pytest tests/ -v

  # Known vulnerabilities in what a user installs (the package, its dependencies, the dashboard extra).
  # Runs on every push and PR, and before a release through workflow_call. A finding without a fix yet
  # is excluded explicitly with --ignore-vuln <id> here, never by dropping the step.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the package as a user would
        run: |
          python -m pip install --upgrade pip setuptools
          pip install ".[dashboard]"
      # pip-audit runs from its own environment (pipx) so its dependencies are not what gets audited;
      # the list is exactly what pip installed, without re-resolving it.
      - name: pip-audit
        run: |
          pip freeze --exclude synapptic > installed.txt
          pipx run pip-audit --strict --no-deps --desc on -r installed.txt
