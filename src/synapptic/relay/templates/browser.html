<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>synapptic — sessions</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f172a; color: #cbd5e1; height: 100vh; display: flex; flex-direction: column; }

/* Shared nav */
.syn-nav { height: 48px; padding: 0 24px; border-bottom: 1px solid #1e293b; background: #0C1426; display: flex; align-items: center; gap: 20px; font-size: 14px; flex-shrink: 0; }
.syn-nav a { color: #94a3b8; text-decoration: none; }
.syn-nav a:hover { color: #cbd5e1; text-decoration: underline; }
.syn-nav .syn-active { color: #64748b; cursor: default; text-decoration: none; font-weight: 600; }
.syn-logo { font-weight: 700; font-size: 22px; color: #94a3b8; letter-spacing: -0.5px; margin-right: 16px; padding-right: 20px; border-right: 1px solid #1e293b; }
.content-row { flex: 1; display: flex; overflow: hidden; }

/* Projects panel (left) */
.projects-panel { width: 280px; min-width: 280px; background: #0C1426; border-right: 1px solid #1e293b; display: flex; flex-direction: column; overflow-y: auto; }
.projects-header { padding: 12px 14px; border-bottom: 1px solid #1e293b; font-size: 11px; font-weight: 600; color: #64748b; text-transform: uppercase; letter-spacing: 0.5px; }
.project-item { padding: 8px 14px; cursor: pointer; display: flex; justify-content: space-between; font-size: 13px; color: #94a3b8; }
.project-item:hover { background: #1C2638; }
.project-item.active { background: #1e293b; color: #cbd5e1; }
.project-item .badge { background: #1e293b; padding: 1px 6px; border-radius: 10px; font-size: 11px; color: #64748b; }

/* Sessions panel (right) */
.sessions-panel { width: 420px; min-width: 420px; background: #0C1426; border-left: 1px solid #1e293b; display: flex; flex-direction: column; }
.sessions-header { padding: 12px 14px; border-bottom: 1px solid #1e293b; display: flex; align-items: center; gap: 8px; }
.sessions-header .count { font-size: 12px; color: #64748b; }
.search-box { flex: 1; padding: 6px 10px; background: #141D30; border: 1px solid #1e293b; border-radius: 6px; color: #cbd5e1; font-size: 12px; outline: none; }
.search-box:focus { border-color: #94a3b8; }
.session-list { overflow-y: auto; flex: 1; }
.session-item { padding: 10px 14px; cursor: pointer; border-bottom: 1px solid #121A2D; }
.session-item:hover { background: #1C2638; }
.session-item.active { background: #1e293b; border-left: 3px solid #94a3b8; }
.session-item.live { border-left: 3px solid #22c55e; }
.session-item .date { font-size: 12px; color: #64748b; }
.session-item .meta { font-size: 11px; color: #475569; margin-top: 2px; }
.session-item .preview { font-size: 12px; color: #94a3b8; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.live-dot { display: inline-block; width: 6px; height: 6px; background: #22c55e; border-radius: 50%; margin-right: 4px; animation: pulse 2s infinite; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }

/* Main area */
.main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

/* Sticky metrics bar */
.metrics-bar { display: none; padding: 8px 20px; background: #0C1426; border-bottom: 1px solid #1e293b; flex-shrink: 0; justify-content: space-evenly; align-items: center; }
.metrics-bar.visible { display: flex; }
.metric { display: flex; flex-direction: column; align-items: center; flex: 1; }
.metric-val { font-size: 16px; font-weight: 600; color: #64748b; font-variant-numeric: tabular-nums; }
.metric-label { font-size: 10px; color: #334155; text-transform: uppercase; letter-spacing: 0.5px; margin-top: 1px; }

.chat { flex: 1; overflow-y: auto; padding: 20px; }
.empty-state { display: flex; align-items: center; justify-content: center; height: 100%; color: #475569; font-size: 14px; }

/* Chat bubbles */
.turn { margin-bottom: 16px; max-width: 85%; }
.turn.user { margin-left: auto; }
.turn.assistant { margin-right: auto; }
.turn-header { font-size: 11px; color: #475569; margin-bottom: 4px; display: flex; gap: 8px; align-items: center; }
.turn.user .turn-header { justify-content: flex-end; }
.turn-body { padding: 12px 16px; border-radius: 12px; font-size: 14px; line-height: 1.6; color: #94a3b8; }
.turn.user .turn-body { background: #141D30; border: 1px solid #1e293b; border-bottom-right-radius: 4px; }
.turn.assistant .turn-body { background: #0C1426; border: 1px solid #1e293b; border-bottom-left-radius: 4px; }

/* Token badge */
.token-badge { font-size: 10px; color: #475569; background: #0C1426; padding: 2px 6px; border-radius: 4px; }

/* Tool calls — compact inline pills */
.tool-group { margin: 6px 0; padding: 4px 0; }
.tool-pill { display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px; margin: 2px 4px 2px 0; background: #0C1426; border: 1px solid #1e293b; border-radius: 12px; font-size: 11px; color: #94a3b8; cursor: pointer; }
.tool-pill:hover { background: #1C2638; }
.tool-pill .tool-name { font-weight: 600; }
.tool-pill .tool-desc { color: #475569; max-width: 300px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* Tool result — collapsed, subtle */
.tool-result { margin: 2px 0 6px 12px; font-size: 11px; }
.tool-result summary { cursor: pointer; color: #334155; font-size: 11px; }
.tool-result summary:hover { color: #64748b; }
.tool-result .result-content { margin-top: 4px; padding: 6px 10px; background: #0A1022; border-radius: 4px; color: #64748b; white-space: pre-wrap; max-height: 200px; overflow-y: auto; font-family: 'Fira Code', 'SF Mono', monospace; font-size: 11px; word-break: break-all; }

/* Markdown in chat */
.turn-body pre { background: #0A1022; padding: 8px; border-radius: 4px; overflow-x: auto; margin: 8px 0; font-family: 'Fira Code', 'SF Mono', monospace; font-size: 13px; }
.turn-body code { background: #0A1022; padding: 1px 4px; border-radius: 3px; font-family: 'Fira Code', 'SF Mono', monospace; font-size: 13px; }
.turn-body pre code { background: none; padding: 0; }
.turn-body h1, .turn-body h2, .turn-body h3 { margin: 12px 0 6px; color: #cbd5e1; }
.turn-body h1 { font-size: 18px; }
.turn-body h2 { font-size: 16px; }
.turn-body h3 { font-size: 14px; }
.turn-body a { color: #94a3b8; }
.turn-body strong { color: #e2e8f0; }
.turn-body ul, .turn-body ol { margin-left: 20px; }

/* Compaction banner */
.compaction-banner { margin: 24px 0; padding: 10px 16px; background: #172033; border: 1px dashed #334155; border-radius: 8px; text-align: center; font-size: 12px; color: #94a3b8; }
.compaction-banner .compact-label { font-weight: 600; }
.compaction-banner .compact-meta { color: #475569; margin-left: 8px; }

/* Loading */
.loading { color: #475569; text-align: center; padding: 40px; }

/* Scroll to bottom button */
.scroll-btn { position: fixed; bottom: 24px; right: 460px; width: 36px; height: 36px; background: #1e293b; border: 1px solid #334155; border-radius: 50%; color: #94a3b8; font-size: 18px; cursor: pointer; display: none; align-items: center; justify-content: center; z-index: 10; transition: opacity 0.2s; }
.scroll-btn:hover { background: #334155; color: #cbd5e1; }
.scroll-btn.visible { display: flex; }
</style>
</head>
<body>

{{NAV}}

<div class="content-row">

<div class="projects-panel">
  <div class="projects-header">Projects</div>
  <div id="projects"></div>
</div>

<div class="main">
  <div class="metrics-bar" id="metrics-bar">
    <div class="metric"><span class="metric-val" id="m-requests">-</span><span class="metric-label">requests</span></div>
    <div class="metric"><span class="metric-val" id="m-input">-</span><span class="metric-label">input</span></div>
    <div class="metric"><span class="metric-val" id="m-output">-</span><span class="metric-label">output</span></div>
    <div class="metric"><span class="metric-val" id="m-cache">-</span><span class="metric-label">cache</span></div>
    <div class="metric"><span class="metric-val cost" id="m-cost">-</span><span class="metric-label">cost</span></div>
  </div>
  <div class="chat" id="chat">
    <div class="empty-state">Select a session from the sidebar</div>
  </div>
</div>

<div class="sessions-panel">
  <div class="sessions-header">
    <input type="text" class="search-box" id="search" placeholder="Search...">
    <span class="count" id="total-count"></span>
  </div>
  <div class="session-list" id="sessions"></div>
</div>

<button class="scroll-btn" id="scroll-btn" onclick="document.getElementById('chat').scrollTop = document.getElementById('chat').scrollHeight">&#8595;</button>
</div><!-- /content-row -->

<script>
let allSessions = [];
let activeProject = null;
let activeSessionId = null;

async function loadProjects() {
  const res = await fetch('/browser/api/projects');
  const projects = await res.json();
  const el = document.getElementById('projects');
  el.innerHTML = '<div class="project-item' + (!activeProject ? ' active' : '') + '" onclick="filterProject(null)"><span>All projects</span></div>';
  projects.forEach(p => {
    const name = p.slug || p.project;
    el.innerHTML += `<div class="project-item${activeProject === name ? ' active' : ''}" onclick="filterProject('${name}')">
      <span>${name}</span><span class="badge">${p.sessions}</span>
    </div>`;
  });
}

async function loadSessions() {
  const url = activeProject ? `/browser/api/sessions?project=${activeProject}` : '/browser/api/sessions';
  const res = await fetch(url);
  const indexed = await res.json();
  // Re-inject any active sessions not yet in the index
  const injected = allSessions.filter(s => s.project === 'active' && !indexed.find(i => (i.session_id || i.id) === s.session_id));
  allSessions = [...injected, ...indexed];
  document.getElementById('total-count').textContent = `${allSessions.length} sessions`;
  renderSessions(allSessions);
}

function renderSessions(sessions) {
  const el = document.getElementById('sessions');
  el.innerHTML = '';
  sessions.forEach(s => {
    const date = s.first_timestamp ? new Date(s.first_timestamp).toLocaleString() : s.modified;
    const div = document.createElement('div');
    const sid = s.session_id || s.id;
    div.className = 'session-item' + (activeSessionId === sid ? ' active' : '') + (activeSessions.has(sid) ? ' live' : '');
    div.dataset.sid = sid;
    div.onclick = () => loadSession(sid, s.project, s.model);
    const title = s.title ? `<div class="preview">${escapeHtml(s.title.slice(0, 80))}</div>` : '';
    const size = s.file_size ? Math.round(s.file_size / 1024) : (s.size_kb || 0);
    const msgs = s.message_count || s.messages || 0;
    const liveDot = activeSessions.has(sid) ? '<span class="live-dot"></span>' : '';
    div.innerHTML = `<div class="date">${liveDot}${date}</div>${title}
      <div class="meta">${s.project} · ${s.model || '?'} · ${msgs} msgs · ${size}KB</div>`;
    el.appendChild(div);
  });
}

function filterProject(slug) {
  activeProject = slug;
  loadProjects();
  loadSessions();
}

async function loadSession(sessionId, project, model) {
  activeSessionId = sessionId;
  renderSessions(allSessions.filter(s => !activeProject || s.project === activeProject));

  const chat = document.getElementById('chat');
  chat.innerHTML = '<div class="loading">Loading...</div>';
  document.title = `synapptic — ${project} · ${sessionId.slice(0, 8)}`;

  const res = await fetch(`/browser/api/session/${sessionId}`);
  const data = await res.json();

  if (data.error) {
    chat.innerHTML = `<div class="empty-state">${data.error}</div>`;
    return;
  }

  chat.innerHTML = '';
  data.turns.forEach(turn => {
    // Compaction banner
    if (turn.role === 'system') {
      const block = turn.blocks[0] || {};
      if (block.type === 'compaction') {
        const div = document.createElement('div');
        div.className = 'compaction-banner';
        const tokens = block.pre_tokens ? fmtTok(block.pre_tokens) : '?';
        const time = turn.timestamp ? new Date(turn.timestamp).toLocaleTimeString() : '';
        div.innerHTML = `<span class="compact-label">context compacted</span><span class="compact-meta">${block.trigger} · ${tokens} tokens · ${time}</span>`;
        chat.appendChild(div);
        return;
      }
    }

    const div = document.createElement('div');
    div.className = `turn ${turn.role}`;

    let headerParts = [];
    headerParts.push(`<span style="color:#64748b">${turn.role === 'user' ? 'You' : 'Agent'}</span>`);
    if (turn.timestamp) headerParts.push(new Date(turn.timestamp).toLocaleTimeString());
    if (turn.model) headerParts.push(turn.model);
    if (turn.usage) {
      const u = turn.usage;
      headerParts.push(`<span class="token-badge">${fmtTok(u.input_tokens)} in / ${fmtTok(u.output_tokens)} out${u.cache_read ? ' / ' + fmtTok(u.cache_read) + ' cache' : ''}</span>`);
    }

    let bodyHtml = '';
    let toolBuffer = [];  // collect consecutive tool_use + tool_result into groups

    function flushTools() {
      if (toolBuffer.length === 0) return;
      let pills = '<div class="tool-group">';
      toolBuffer.forEach(t => {
        if (t.type === 'tool_use') {
          const desc = t.input_summary ? t.input_summary.split(',')[0] : '';
          pills += `<span class="tool-pill"><span class="tool-name">${escapeHtml(t.name)}</span>`;
          if (desc) pills += `<span class="tool-desc">${escapeHtml(desc.slice(0, 60))}</span>`;
          pills += '</span>';
        } else if (t.type === 'tool_result') {
          const preview = t.content.slice(0, 120).replace(/\n/g, ' ');
          pills += `<details class="tool-result"><summary>${escapeHtml(preview.slice(0, 60))}${preview.length > 60 ? '...' : ''}</summary><div class="result-content">${escapeHtml(t.content.slice(0, 1000))}</div></details>`;
        }
      });
      pills += '</div>';
      bodyHtml += pills;
      toolBuffer = [];
    }

    turn.blocks.forEach(block => {
      if (block.type === 'text') {
        flushTools();
        bodyHtml += renderMarkdown(block.text);
      } else if (block.type === 'tool_use' || block.type === 'tool_result') {
        toolBuffer.push(block);
      }
    });
    flushTools();

    div.innerHTML = `<div class="turn-header">${headerParts.join(' · ')}</div><div class="turn-body">${bodyHtml}</div>`;
    chat.appendChild(div);
  });

  // Show session token stats from JSONL (live sessions get incremental WS updates on top)
  if (data.stats) {
    updateMetrics(data.stats);
  }

  chat.scrollTop = 0;
}

function fmtTok(n) {
  if (n >= 1000) return (n / 1000).toFixed(1) + 'k';
  return String(n);
}

function escapeHtml(str) {
  return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function renderMarkdown(text) {
  // Basic markdown: code blocks, inline code, headers, bold, links, lists
  let html = escapeHtml(text);

  // Code blocks (``` ... ```)
  html = html.replace(/```(\w*)\n([\s\S]*?)```/g, '<pre><code>$2</code></pre>');

  // Inline code
  html = html.replace(/`([^`]+)`/g, '<code>$1</code>');

  // Headers
  html = html.replace(/^### (.+)$/gm, '<h3>$1</h3>');
  html = html.replace(/^## (.+)$/gm, '<h2>$1</h2>');
  html = html.replace(/^# (.+)$/gm, '<h1>$1</h1>');

  // Bold
  html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');

  // Links
  html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');

  // Line breaks (but not inside pre blocks)
  html = html.replace(/\n/g, '<br>');
  // Fix double breaks inside pre
  html = html.replace(/<pre><code>([\s\S]*?)<\/code><\/pre>/g, (m, code) => {
    return '<pre><code>' + code.replace(/<br>/g, '\n') + '</code></pre>';
  });

  return html;
}

// Search
let searchTimeout = null;
document.getElementById('search').addEventListener('input', (e) => {
  const q = e.target.value.trim();
  clearTimeout(searchTimeout);
  if (!q) {
    renderSessions(allSessions);
    return;
  }
  // Debounce: wait 300ms, then try FTS search first, fallback to local filter
  searchTimeout = setTimeout(async () => {
    try {
      const res = await fetch(`/browser/api/search?q=${encodeURIComponent(q)}`);
      const results = await res.json();
      if (results.length > 0) {
        renderSessions(results);
        return;
      }
    } catch (err) {}
    // Fallback: local filter on loaded sessions
    const ql = q.toLowerCase();
    const filtered = allSessions.filter(s =>
      (s.project || '').toLowerCase().includes(ql) ||
      (s.model || '').toLowerCase().includes(ql) ||
      (s.title || '').toLowerCase().includes(ql) ||
      (s.session_id || s.id || '').includes(ql)
    );
    renderSessions(filtered);
  }, 300);
});

// Scroll button visibility
document.getElementById('chat').addEventListener('scroll', function() {
  const btn = document.getElementById('scroll-btn');
  const chat = this;
  const nearBottom = chat.scrollHeight - chat.scrollTop - chat.clientHeight < 300;
  btn.classList.toggle('visible', !nearBottom && chat.scrollHeight > chat.clientHeight + 500);
});

// Init
let liveSocket = null;
let activeSessions = new Set();
let pendingWatch = null;

function connectSocket() {
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  liveSocket = new WebSocket(`${proto}//${location.host}/browser/ws`);
  liveSocket.onopen = () => {
    if (pendingWatch) {
      liveSocket.send(JSON.stringify({type: 'watch', session_id: pendingWatch}));
    }
  };
  liveSocket.onmessage = (e) => {
    const msg = JSON.parse(e.data);
    if (msg.type === 'turn') {
      appendTurn(document.getElementById('chat'), msg.data);
    } else if (msg.type === 'metrics') {
      updateMetrics(msg.data);
    } else if (msg.type === 'active_check') {
      // New session started — re-scan active sessions after brief delay for JSONL to appear
      setTimeout(checkActiveSessions, 400);
    } else if (msg.type === 'session_ended') {
      // SessionEnd hook fired — remove from active set and re-render sidebar
      const sid = msg.session_id;
      activeSessions.delete(sid);
      allSessions = allSessions.filter(s => (s.session_id || s.id) !== sid || s.project !== 'active');
      renderSessions(allSessions.filter(s => !activeProject || s.project === activeProject));
    }
  };
  liveSocket.onclose = () => { setTimeout(connectSocket, 3000); };
  liveSocket.onerror = () => {};
}

function watchSession(sessionId) {
  pendingWatch = sessionId;
  if (liveSocket && liveSocket.readyState === WebSocket.OPEN) {
    liveSocket.send(JSON.stringify({type: 'watch', session_id: sessionId}));
  }
}

connectSocket();

function appendTurn(chat, turn) {
  const div = document.createElement('div');
  div.className = `turn ${turn.role}`;
  let headerParts = [];
  if (turn.timestamp) headerParts.push(new Date(turn.timestamp).toLocaleTimeString());
  if (turn.model) headerParts.push(turn.model);
  let bodyHtml = '';
  let toolBuffer = [];
  function flushT() {
    if (!toolBuffer.length) return;
    let p = '<div class="tool-group">';
    toolBuffer.forEach(t => {
      if (t.type === 'tool_use') { p += `<span class="tool-pill"><span class="tool-name">${escapeHtml(t.name)}</span></span>`; }
      else if (t.type === 'tool_result') { p += `<details class="tool-result"><summary>${escapeHtml((t.content||'').slice(0,60))}</summary><div class="result-content">${escapeHtml((t.content||'').slice(0,1000))}</div></details>`; }
    });
    p += '</div>'; bodyHtml += p; toolBuffer = [];
  }
  (turn.blocks || []).forEach(b => {
    if (b.type === 'text') { flushT(); bodyHtml += renderMarkdown(b.text); }
    else if (b.type === 'tool_use' || b.type === 'tool_result') { toolBuffer.push(b); }
  });
  flushT();
  div.innerHTML = `<div class="turn-header">${headerParts.join(' · ')}</div><div class="turn-body">${bodyHtml}</div>`;
  chat.appendChild(div);
  // Auto-scroll if near bottom
  if (chat.scrollHeight - chat.scrollTop - chat.clientHeight < 200) {
    chat.scrollTop = chat.scrollHeight;
  }
}

// Check for active sessions every 30s and mark them in sidebar
let relaySessions = [];

async function checkActiveSessions() {
  try {
    const res = await fetch('/browser/api/active');
    const active = await res.json();
    activeSessions = new Set(active.map(s => s.session_id));
    // Remove stale injected active sessions, then re-inject current ones
    allSessions = allSessions.filter(s => s.project !== 'active');
    active.filter(s => s.source === 'jsonl').forEach(a => {
      if (!allSessions.find(s => (s.session_id || s.id) === a.session_id)) {
        allSessions.unshift({
          session_id: a.session_id,
          project: 'active',
          model: '',
          title: 'Active session',
          message_count: 0,
          file_size: 0,
          first_timestamp: new Date().toISOString(),
        });
      }
    });

    // Never touch the metrics bar here — it's controlled entirely by session click / WS push

    if (allSessions.length > 0) renderSessions(allSessions);
  } catch (e) {}
}

// Override loadSession — tail JSONL via WebSocket, live metrics only for active sessions
const origLoadSession = loadSession;
loadSession = async function(sessionId, project, model) {
  hideMetrics();
  await origLoadSession(sessionId, project, model);
  // Always watch for live turn streaming; server resets metrics_active on each watch
  watchSession(sessionId);
  // For active sessions: request live metrics tracking (server computes from JSONL, pushes on new turns)
  if (activeSessions.has(sessionId) && liveSocket && liveSocket.readyState === WebSocket.OPEN) {
    liveSocket.send(JSON.stringify({type: 'metrics', session_id: sessionId}));
  }
};

// Load index first, then overlay active sessions on top
loadProjects();
loadSessions().then(() => checkActiveSessions());
setInterval(checkActiveSessions, 5000);

// Metrics — pushed via WebSocket for active relay sessions, fetched once for historical
function fmtNum(n) { return n >= 1000000 ? (n/1000000).toFixed(1)+'M' : n >= 1000 ? (n/1000).toFixed(1)+'k' : String(n); }

function updateMetrics(s) {
  document.getElementById('m-requests').textContent = s.total_requests;
  document.getElementById('m-input').textContent = fmtNum(s.total_input_tokens);
  document.getElementById('m-output').textContent = fmtNum(s.total_output_tokens);
  document.getElementById('m-cache').textContent = fmtNum(s.total_cache_read_tokens || 0);
  document.getElementById('m-cost').textContent = '$' + (s.estimated_cost_usd || 0).toFixed(2);
  document.getElementById('metrics-bar').classList.add('visible');
}

function hideMetrics() {
  document.getElementById('metrics-bar').classList.remove('visible');
}
</script>
</body>
</html>
